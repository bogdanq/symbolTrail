<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="260"
  viewBox="0 0 760 260"
  fill="none"
  role="img"
  aria-labelledby="index-title index-desc"
>
  <title id="index-title">Независимые индексы и их репозитории</title>
  <desc id="index-desc">
    Индекс «Продукт» объединяет репозитории frontend, backend и shared.
    Отдельный индекс «Инструменты» объединяет cli и sdk. Связи строятся внутри
    каждого индекса; между индексами связей нет.
  </desc>
  <rect width="760" height="260" fill="#fff" />
  <rect
    x="24"
    y="24"
    width="344"
    height="184"
    rx="10"
    fill="#f9fafb"
    stroke="#e5e7eb"
  />
  <rect
    x="392"
    y="24"
    width="344"
    height="184"
    rx="10"
    fill="#f9fafb"
    stroke="#e5e7eb"
  />
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="44" y="53" font-size="15" font-weight="600" fill="#101828">
      Индекс «Продукт»
    </text>
    <text x="412" y="53" font-size="15" font-weight="600" fill="#101828">
      Индекс «Инструменты»
    </text>
    <text x="44" y="76" font-size="11" fill="#6a7282">3 репозитория</text>
    <text x="412" y="76" font-size="11" fill="#6a7282">2 репозитория</text>
  </g>
  <g stroke="#155dfc" stroke-width="1.5">
    <path d="M88 156V173H302V156" />
    <path d="M194 156V173" />
    <path d="M481 156V173H643V156" />
  </g>
  <g fill="#eff6ff" stroke="#155dfc">
    <rect x="44" y="106" width="88" height="50" rx="7" />
    <rect x="150" y="106" width="88" height="50" rx="7" />
    <rect x="256" y="106" width="92" height="50" rx="7" />
    <rect x="412" y="106" width="138" height="50" rx="7" />
    <rect x="570" y="106" width="146" height="50" rx="7" />
  </g>
  <g
    font-family="ui-monospace,Menlo,monospace"
    font-size="12"
    fill="#1447e6"
    text-anchor="middle"
  >
    <text x="88" y="136">frontend</text>
    <text x="194" y="136">backend</text>
    <text x="302" y="136">shared</text>
    <text x="481" y="136">cli</text>
    <text x="643" y="136">sdk</text>
  </g>
  <g
